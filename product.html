<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link rel="stylesheet" href="/style/">
</head>

<body>

    <section class="products-section">

        <div class="section-heading">
            <h2>Our Products</h2>
            <p>Explore our latest computer accessories</p>
        </div>


        <!-- Slider -->
        <div class="slider">

            <!-- Left Arrow -->
            <a href="#product1" class="slider-btn left">
               
            </a>


            <div class="products-container" id="product1">

                <!-- Product 1 -->
                <div class="product-card">

                    <div class="product-image">
                        <img src="./images/computer.jpg"
                            alt="Desktop Computer">
                    </div>

                    <div class="product-info">

                        <h3>Desktop Computer</h3>

                        <p class="price">$450</p>

                        <button class="buy-btn">
                            Buy Now
                        </button>

                    </div>

                </div>


                <!-- Product 2 -->
                <div class="product-card">

                    <div class="product-image">
                        <img src="./images/desktop.jpg"
                            alt="Desktop PC">
                    </div>

                    <div class="product-info">

                        <h3>Office Desktop PC</h3>

                        <p class="price">$380</p>

                        <button class="buy-btn">
                            Buy Now
                        </button>

                    </div>

                </div>


                <!-- Product 3 -->
                <div class="product-card">

                    <div class="product-image">
                        <img src="./images/keyboard.jpg"
                            alt="USB Keyboard">
                    </div>

                    <div class="product-info">

                        <h3>USB Keyboard</h3>

                        <p class="price">$35</p>

                        <button class="buy-btn">
                            Buy Now
                        </button>

                    </div>

                </div>


                <!-- Product 4 -->
                <div class="product-card">

                    <div class="product-image">
                        <img src="./images/scanner.jpg"
                            alt="Document Scanner">
                    </div>

                    <div class="product-info">

                        <h3>Document Scanner</h3>

                        <p class="price">$120</p>

                        <button class="buy-btn">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>


            <!-- Right Arrow -->
            <a href="#product4" class="slider-btn right">
                &#10095;
            </a>

        </div>


        <!-- Small Slider Indicators -->
        <div class="slider-dots">

            <a href="#product1"></a>
            <a href="#product2"></a>
            <a href="#product3"></a>
            <a href="#product4"></a>

        </div>

    </section>

</body>
</html>
