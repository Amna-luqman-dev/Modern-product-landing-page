<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern-product-landing-page</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div>
        <!-- logo -->
        <h1 style="color: black; padding-top: 5px">
          SMART <span style="color: blue">SHOP</span>
        </h1>
        <!-- <img src="image.png" alt="image"> -->
      </div>
      <div class="nav-links">
        <li><a href="#home"> Home</a></li>
        <li><a href="#product">Product</a></li>
        <li><a href="#categories">Categories</a></li>
        <li><a href="#contact"> Contact</a></li>
      </div>
    </nav>
    
    <section id="home"></section>
  <section id="product"></section>
    <section id="categories"></section>
  <section id="contact"></section>

  <section id="footer"></section>
  <script>
    // JS to load external HTML components
    function loadHTML(id, file) {
      fetch(file)
        .then(res => res.text())
        .then(data => document.getElementById(id).innerHTML = data);
    }

    loadHTML("home", "home.html");
    loadHTML("product", "product.html");
    loadHTML("categories", "categories.html");
    loadHTML("contact", "contact.html");
   loadHTML("footer", "footer.html");
  </script>

    
    
  </body>
</html>
